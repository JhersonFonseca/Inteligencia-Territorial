<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inteligencia territorial · Bogotá</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/web/estilos.css">
</head>
<body>
  <div id="aviso-sintetico" class="aviso aviso-sintetico" hidden>
    DATOS SINTÉTICOS DE PRUEBA — no representan información real de Bogotá.
  </div>
  <header>
    <h1>Inteligencia territorial · Bogotá <span class="version">v0.1</span></h1>
    <form id="buscador" autocomplete="off">
      <input id="q" type="search" placeholder="Buscar localidad, UPL, sector o código de manzana" minlength="2">
      <ul id="resultados" hidden></ul>
    </form>
  </header>
  <main>
    <aside id="panel-capas">
      <h2>Capas</h2>
      <div id="capas"></div>
      <p class="nota">Las manzanas y el estrato se cargan al acercar el mapa (zoom 15 o más).</p>
      <h2>Fuentes no habilitadas</h2>
      <ul id="no-habilitadas"></ul>
    </aside>
    <div id="mapa"></div>
    <aside id="panel-ficha">
      <p class="vacio">Selecciona una unidad territorial en el mapa o con el buscador.</p>
    </aside>
  </main>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/web/app.js"></script>
</body>
</html>
