# Registro de fuentes territoriales.
#
# Cada dato de esta lista se verificó consultando el servicio o la ficha oficial el 2026-10-15,
# salvo donde dice "pendiente". Una fuente solo se habilita para consulta externa si:
#   1. licencia_verificada es true,
#   2. no tiene pendientes bloqueantes, y
#   3. tiene una versión publicada que pasó todas las validaciones bloqueantes.
#
# Los nombres de campos marcados con "se validan al cargar" se tomaron de un servicio relacionado.
# Si la descarga no los contiene, la carga queda en cuarentena y no se publica.

fecha_verificacion: "2026-10-15"

dominio_estrato:
  0: "Sin estrato"
  1: "Estrato 1"
  2: "Estrato 2"
  3: "Estrato 3"
  4: "Estrato 4"
  5: "Estrato 5"
  6: "Estrato 6"
  7: "Sin información"
  9: "Sin estrato"

fuentes:

  - id: mr_localidad
    nombre: "Localidad"
    nivel: localidad
    entidad: "Secretaría Distrital de Planeación - SDP (Mapa de Referencia, IDECA)"
    tipo: arcgis_rest
    url: "https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer/48"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/mapa-de-referencia"
    licencia: "CC BY 4.0"
    licencia_verificada: true
    fecha_dato: "2022-08-05"
    fecha_dato_origen: "Reporte de calidad del Mapa de Referencia V06.26"
    campos: {llave: LOCCODIGO, nombre: LOCNOMBRE}
    advertencias: []
    pendientes: []

  - id: mr_upl
    nombre: "Unidad de Planeamiento Local (UPL)"
    nivel: upl
    entidad: "Secretaría Distrital de Planeación - SDP (Mapa de Referencia, IDECA)"
    tipo: arcgis_rest
    url: "https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer/44"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/mapa-de-referencia"
    licencia: "CC BY 4.0"
    licencia_verificada: true
    fecha_dato: "2023-02-15"
    fecha_dato_origen: "Reporte de calidad del Mapa de Referencia V06.26"
    campos: {llave: CODIGO_UPL, nombre: NOMBRE}
    advertencias: []
    pendientes: []

  - id: mr_sector
    nombre: "Sector catastral"
    nivel: sector
    entidad: "Unidad Administrativa Especial de Catastro Distrital - UAECD (Mapa de Referencia, IDECA)"
    tipo: arcgis_rest
    url: "https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer/37"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/mapa-de-referencia"
    licencia: "CC BY 4.0"
    licencia_verificada: true
    fecha_dato: "2026-07-28"
    fecha_dato_origen: "Reporte de calidad del Mapa de Referencia V06.26"
    campos: {llave: SCACODIGO, nombre: SCANOMBRE}
    advertencias:
      - "El sector catastral es una división de Catastro; no coincide necesariamente con los barrios que reconoce la comunidad."
    pendientes: []

  - id: mr_manzana
    nombre: "Manzana"
    nivel: manzana
    entidad: "Unidad Administrativa Especial de Catastro Distrital - UAECD (Mapa de Referencia, IDECA)"
    tipo: arcgis_rest
    url: "https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer/40"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/mapa-de-referencia"
    licencia: "CC BY 4.0"
