    advertencias: []
    pendientes: []

  - id: sdp_estrato_manzana_2025
    nombre: "Estrato asignado por manzana (2025)"
    nivel: indicador_manzana
    entidad: "Secretaría Distrital de Planeación - SDP"
    tipo: descarga_geojson
    url: "https://datosabiertos.bogota.gov.co/dataset/55467552-0af4-4524-a390-a2956035744e/resource/29f2d770-bd5d-4450-9e95-8737167ba12f/download/manzanaestratificacion.json"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/estratificacion-para-bogota"
    licencia: "CC BY 4.0"
    licencia_verificada: true
    fecha_dato: "2025-11-20"
    fecha_dato_origen: "Ficha CKAN, campo 'Fecha del dato'"
    # Nombres tomados del servicio REST de estratificación; se validan al cargar.
    campos: {llave: CODIGO_MANZANA, estrato: ESTRATO}
    advertencias:
      - "El estrato clasifica inmuebles residenciales para el cobro diferencial de servicios públicos. No mide ingresos, preferencias ni características de las personas."
      - "Según la ficha, el estrato de cada predio depende del decreto vigente de la manzana (Decreto 551 de 2019), con excepciones por estratos atípicos, recursos y vivienda VIP."
    pendientes: []

  - id: mr_lote_manzana
    nombre: "Relación lote - manzana"
    nivel: relacion
    entidad: "Unidad Administrativa Especial de Catastro Distrital - UAECD (Mapa de Referencia, IDECA)"
    tipo: arcgis_tabla
    url: "https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/Mapa_Referencia/Mapa_Referencia/MapServer/38"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/mapa-de-referencia"
    licencia: "CC BY 4.0"
    licencia_verificada: true
    fecha_dato: "2026-07-28"
    fecha_dato_origen: "Reporte de calidad del Mapa de Referencia V06.26"
    # Relación oficial 'Pertenece a la manzana' de la capa Lote (MR/38).
    campos: {llave: LOTCODIGO, manzana: MANZCODIGO}
    advertencias: []
    pendientes: []

  - id: sdp_estrato_predio_2026
    nombre: "Predios residenciales por estrato (2026)"
    nivel: indicador_predio
    entidad: "Secretaría Distrital de Planeación - SDP"
    tipo: descarga_csv_zip
    url: "https://datosabiertos.bogota.gov.co/dataset/68ccdaca-5403-4fe6-b727-be01b5d28f15/resource/f1d91324-af38-405e-ad13-026c50448ed1/download/esoc.csv.zip"
    ficha_url: "https://datosabiertos.bogota.gov.co/dataset/estrato-socioeconomico-bogota-d-c"
    licencia: "CC BY 4.0"
    licencia_verificada: true
    fecha_dato: "2026-07-22"
    fecha_dato_origen: "Ficha CKAN, campo 'Fecha del dato'"
    # Nombres tomados de la tabla Estrato del Mapa de Referencia (MR/51); se validan al cargar.
    # El identificador predial (CHIP) no se lee ni se almacena.
    campos: {lote: ESOCLOTE, estrato: ESOESTRATO}
    advertencias:
      - "Cuenta predios, no viviendas ni personas. Un lote puede tener varios predios, por ejemplo en propiedad horizontal."
      - "El estrato clasifica inmuebles residenciales para el cobro diferencial de servicios públicos. No mide ingresos, preferencias ni características de las personas."
    pendientes: []

  - id: sdp_estrato_manzana_2019_rest
    nombre: "Estratificación por manzana, servicio histórico (dato de 2019)"
    nivel: indicador_manzana
    entidad: "Secretaría Distrital de Planeación - SDP"
    tipo: arcgis_rest
    url: "https://serviciosgis.catastrobogota.gov.co/arcgis/rest/services/ordenamientoterritorial/estratificacion/MapServer/1"
    ficha_url: null
    licencia: null
    licencia_verificada: false
    fecha_dato: "2019-08-15"
    fecha_dato_origen: "Descripción de la capa en el servicio REST"
    conteo_verificado: 45051
    campos: {llave: CODIGO_MANZANA, estrato: ESTRATO}
    advertencias:
      - "Capa histórica. No es equivalente a la estratificación de 2025."
    pendientes:
      - texto: "La licencia del servicio no figura en el servicio ni en una ficha identificada."
        bloqueante: true
